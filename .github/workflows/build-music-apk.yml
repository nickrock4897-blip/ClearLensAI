name: Build Christmas Countdown Music APK

on:
  push:
    branches: [ "music-service-enhancement" ]
    paths:
      - ".github/workflows/build-music-apk.yml"
      - "patches/music-background-part-*.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore the original Android project
        run: |
          cat archive/chunk-*.b64 > "$RUNNER_TEMP/project.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/project.tar.xz.b64" > "$RUNNER_TEMP/project.tar.xz"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/project.tar.xz" -C "$RUNNER_TEMP/source"

      - name: Apply existing local music picker
        run: |
          base64 --decode patches/music-player.patch.gz.b64 | gunzip > "$RUNNER_TEMP/music-player.patch"
          cd "$RUNNER_TEMP/source/WeihnachtsferienCountdown"
          patch --batch -p1 < "$RUNNER_TEMP/music-player.patch"

      - name: Apply background music feature only
        run: |
          cat patches/music-background-part-*.b64 > "$RUNNER_TEMP/music-background.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/music-background.patch.gz.b64" | gunzip > "$RUNNER_TEMP/music-background.patch"
          cd "$RUNNER_TEMP/source/WeihnachtsferienCountdown"
          patch --batch -p1 < "$RUNNER_TEMP/music-background.patch"

      - name: Generate original offline Christmas MP3 tracks
        working-directory: ${{ runner.temp }}/source/WeihnachtsferienCountdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-numpy
          /usr/bin/python3 tools/generate_music.py
          test "$(find app/src/main/res/raw -maxdepth 1 -name '*.mp3' | wc -l)" -eq 9
          for track in app/src/main/res/raw/*.mp3; do
            ffmpeg -v error -i "$track" -f null -
          done
          du -sh app/src/main/res/raw

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/source/WeihnachtsferienCountdown
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and bundled audio
        run: |
          APK="$RUNNER_TEMP/source/WeihnachtsferienCountdown/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          for track in winterlichter schneeflockentanz adventskerzen winterabend sternenglanz gemuetlichezeit schlittenfahrt weihnachtsmorgen tannenduft; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -q "res/raw/$track.mp3"
          done
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeihnachtsferienCountdown-Music-APK
          path: ${{ runner.temp }}/source/WeihnachtsferienCountdown/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
