name: Export source for music feature work

on:
  push:
    branches: [ "music-service-enhancement" ]
    paths:
      - ".github/workflows/export-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current Android source
        run: |
          cat archive/chunk-*.b64 > "$RUNNER_TEMP/project.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/project.tar.xz.b64" > "$RUNNER_TEMP/project.tar.xz"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/project.tar.xz" -C "$RUNNER_TEMP/source"
      - name: Apply existing music player patch
        run: |
          base64 --decode patches/music-player.patch.gz.b64 | gunzip > "$RUNNER_TEMP/music-player.patch"
          cd "$RUNNER_TEMP/source/WeihnachtsferienCountdown"
          patch --batch -p1 < "$RUNNER_TEMP/music-player.patch"
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: music-feature-source
          path: ${{ runner.temp }}/source/WeihnachtsferienCountdown
          if-no-files-found: error
          retention-days: 2
