name: Build Weihnachtsferien Countdown APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "archive/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore Android project archive
        run: |
          cat archive/chunk-*.b64 > "$RUNNER_TEMP/project.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/project.tar.xz.b64" > "$RUNNER_TEMP/project.tar.xz"
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/project.tar.xz" -C "$RUNNER_TEMP/source"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/source/WeihnachtsferienCountdown
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeihnachtsferienCountdown-APK
          path: ${{ runner.temp }}/source/WeihnachtsferienCountdown/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
